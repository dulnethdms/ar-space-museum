<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mini Space Museum</title>

    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

    <script>
        AFRAME.registerComponent('colour-changer', {
            init: function () {
                const planet = this.el;
                const colours = ['#3E6DE0', '#D96A3F', '#E0B04A', '#5BA97A', '#8E6FD6'];
                let index = 0;

                planet.addEventListener('click', function () {
                    index = (index + 1) % colours.length;
                    planet.setAttribute('color', colours[index]);
                });
            }
        });

        AFRAME.registerComponent('scale-toggle', {
            init: function () {
                const rocket = this.el;
                const startScale = rocket.getAttribute('scale').x;
                const growTo = 1.4;
                let grown = false;

                rocket.addEventListener('click', function () {
                    grown = !grown;

                    const size = grown ? startScale * growTo : startScale;

                    rocket.setAttribute('animation__scale', {
                        property: 'scale',
                        to: size + ' ' + size + ' ' + size,
                        dur: 350,
                        easing: 'easeInOutQuad'
                    });
                });
            }
        });

        AFRAME.registerComponent('tap-handler', {
            init: function () {
                const scene = this.el;
                const raycaster = new THREE.Raycaster();
                const pointer = new THREE.Vector2();
                const position = new THREE.Vector3();

                function visible(object) {
                    while (object) {
                        if (!object.visible) {
                            return false;
                        }
                        object = object.parent;
                    }
                    return true;
                }

                function handleTap(clientX, clientY) {
                    if (!scene.camera) {
                        return;
                    }

                    const rect = scene.canvas.getBoundingClientRect();
                    const items = Array.prototype.slice.call(document.querySelectorAll('.clickable'));

                    pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
                    pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
                    raycaster.setFromCamera(pointer, scene.camera);

                    const objects = items.map(function (item) {
                        return item.object3D;
                    });

                    const hits = raycaster.intersectObjects(objects, true);
                    let target = hits.length > 0 ? hits[0].object : null;

                    if (!target) {
                        let nearest = Infinity;

                        items.forEach(function (item) {
                            item.object3D.getWorldPosition(position);
                            position.project(scene.camera);

                            const x = rect.left + ((position.x + 1) / 2) * rect.width;
                            const y = rect.top + ((1 - position.y) / 2) * rect.height;
                            const distance = Math.hypot(x - clientX, y - clientY);

                            if (distance < nearest) {
                                nearest = distance;
                                target = item.object3D;
                            }
                        });

                        if (nearest > rect.height * 0.18) {
                            target = null;
                        }
                    }

                    if (!target) {
                        return;
                    }

                    while (target && !target.el) {
                        target = target.parent;
                    }

                    if (target && target.el && visible(target)) {
                        target.el.emit('click');
                    }
                }

                document.addEventListener('pointerdown', function (event) {
                    handleTap(event.clientX, event.clientY);
                });

                if (!window.PointerEvent) {
                    document.addEventListener('touchstart', function (event) {
                        const touch = event.changedTouches[0];
                        if (touch) {
                            handleTap(touch.clientX, touch.clientY);
                        }
                    });
                }
            }
        });

        AFRAME.registerComponent('marker-status', {
            init: function () {
                const banner = document.querySelector('#status');
                let seenMarker = false;

                this.el.addEventListener('markerFound', function () {
                    seenMarker = true;
                    banner.textContent = 'Marker FOUND!';
                    banner.style.background = '#2E7D32';
                });

                this.el.addEventListener('markerLost', function () {
                    if (!seenMarker) {
                        return;
                    }
                    banner.textContent = 'Marker LOST - Point camera at Hiro marker.';
                    banner.style.background = '#C62828';
                });
            }
        });
    </script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #0B1020;
            font-family: Arial, Helvetica, sans-serif;
        }

        #status {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 999;
            padding: 12px 10px;
            text-align: center;
            font-size: 15px;
            letter-spacing: 0.3px;
            color: #FFFFFF;
            background: #1B2A4A;
        }
    </style>
</head>

<body>
    <div id="status">Looking for marker...</div>

    <a-scene embedded tap-handler vr-mode-ui="enabled: false"
             arjs="sourceType: webcam; debugUIEnabled: false;">

        <a-assets timeout="20000">
            <a-asset-item id="rocket-model" src="models/rocket.glb"></a-asset-item>
        </a-assets>

        <a-entity light="type: ambient; intensity: 0.9"></a-entity>
        <a-entity position="0.6 1.2 1" light="type: directional; intensity: 0.7"></a-entity>

        <a-marker preset="hiro" marker-status>

            <a-cylinder position="0 0.03 0" radius="0.5" height="0.06"
                        segments="48" color="#17233D"></a-cylinder>

            <a-entity position="-0.2 0.06 0.05"
                      animation="property: position;
                                 from: -0.2 0.06 0.05;
                                 to: -0.2 0.09 0.05;
                                 dir: alternate;
                                 dur: 2200;
                                 easing: easeInOutSine;
                                 loop: true">
                <a-entity class="clickable" scale-toggle
                          gltf-model="#rocket-model"
                          position="0 0.096 0"
                          scale="0.25 0.25 0.25"></a-entity>
            </a-entity>

            <a-sphere class="clickable" colour-changer
                      position="0.22 0.2 -0.05"
                      radius="0.12"
                      color="#3E6DE0"
                      animation="property: rotation;
                                 to: 0 360 0;
                                 dur: 40000;
                                 easing: linear;
                                 loop: true"></a-sphere>

            <a-sphere position="0.35 0.34 0.14" radius="0.045" color="#C9D2E0"></a-sphere>

            <a-entity position="0.02 0.48 -0.22">
                <a-box width="0.07" height="0.07" depth="0.07" color="#D8DEE9"></a-box>
                <a-box position="-0.1 0 0" width="0.1" height="0.06" depth="0.01"
                       color="#2F5FA8"></a-box>
                <a-box position="0.1 0 0" width="0.1" height="0.06" depth="0.01"
                       color="#2F5FA8"></a-box>
                <a-cylinder position="0 0.05 0" radius="0.03" height="0.02"
                            color="#B9C2D0"></a-cylinder>
            </a-entity>

            <a-plane position="0 0.13 0.36" width="0.62" height="0.1" color="#101B33"></a-plane>
            <a-text value="SPACE EXPLORER" position="0 0.13 0.365"
                    align="center" width="1.7" color="#E8EEF9"></a-text>

        </a-marker>

        <a-entity camera></a-entity>

    </a-scene>
</body>
</html>
